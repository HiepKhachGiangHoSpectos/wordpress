version: '3.7'
services:
  wordpress:
    image: wordpress:php8.0-apache
    ports:
      - "8082:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: your_db_user
      WORDPRESS_DB_PASSWORD: your_db_password
      WORDPRESS_DB_NAME: your_db_name
    volumes:
      - ./:/var/www/html
      - ./config/php.ini:/usr/local/etc/php/php.ini  # 🛠️ Mount php.ini vào container
    depends_on:
      - db
    command: /bin/bash -c "apache2-foreground"  # Khởi động apache server trong container
    entrypoint: /bin/bash -c "apt-get update && apt-get install -y wget && wget https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar && chmod +x wp-cli.phar && mv wp-cli.phar /usr/local/bin/wp && apache2-foreground"

  db:
    image: mysql:8.1
    ports:
      - 3307:3306
    environment:
      MYSQL_ROOT_PASSWORD: your_root_password
      MYSQL_DATABASE: your_db_name
      MYSQL_USER: your_db_user
      MYSQL_PASSWORD: your_db_password
    command: --innodb_use_native_aio=0
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
